name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Swift package tests (macOS, includes HealthKit implementation compile)
        run: swift test --package-path Packages/WatchPulseKit

      - name: Build iOS app + embedded watchOS app (Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project WatchPulse.xcodeproj \
            -scheme WatchPulse \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES 2>&1 | tee build-simulator.log

      - name: Build iOS app + embedded watchOS app (Device, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project WatchPulse.xcodeproj \
            -scheme WatchPulse \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-device.log

      - name: Build watchOS app standalone scheme (Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project WatchPulse.xcodeproj \
            -scheme WatchPulseWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-watch.log

      - name: Compiler warning summary
        run: |
          grep -hE "(\.swift|\.plist|\.xcassets).*warning:" build-*.log | sort -u > warnings.txt || true
          echo "Unique source warnings: $(wc -l < warnings.txt)"
          head -50 warnings.txt
          # 以 annotation 形式上报，便于通过 API 查看。
          head -20 warnings.txt | while IFS= read -r line; do echo "::warning title=compiler::${line}"; done
          echo "::notice title=warning-count::$(wc -l < warnings.txt) unique source warnings"

      - name: Inspect built app bundle
        run: |
          APP=build/DerivedData/Build/Products/Debug-iphoneos/WatchPulse.app
          plutil -p "$APP/Info.plist" | grep -E "NSHealth|UIRequiredDeviceCapabilities|healthkit|CFBundleIdentifier"
          test -d "$APP/Watch/WatchPulseWatch.app"
          plutil -p "$APP/Watch/WatchPulseWatch.app/Info.plist" | grep -E "WKApplication|WKCompanionAppBundleIdentifier|NSHealth|workout-processing"

      - name: Run package tests and UI tests (demo mode) on iOS Simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          def version(rt):
              return [int(p) for p in rt.rsplit("iOS-", 1)[-1].split("-") if p.isdigit()]
          ios = [(version(rt), d) for rt, ds in data.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          ios.sort(key=lambda x: x[0])
          print(ios[-1][1]["udid"])
          ')
          echo "Using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          # 截图测试只在下面的截图步骤中运行。
          xcodebuild test \
            -project WatchPulse.xcodeproj \
            -scheme WatchPulse \
            -destination "id=$UDID" \
            -derivedDataPath build/DerivedData \
            -skip-testing:WatchPulseUITests/ScreenshotTests \
            CODE_SIGNING_ALLOWED=NO

      # 四个页面 × 浅色 / 深色 / 大字号，以及空数据、权限、失败、数据不足状态（演示模式）。
      # 状态栏固定为 9:41、满电满格，便于改版前后逐张对照。
      - name: Capture screenshots (demo mode)
        if: ${{ !cancelled() && env.SIM_UDID != '' }}
        run: |
          set -o pipefail
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl status_bar "$SIM_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          mkdir -p screenshots
          TEST_RUNNER_WATCHPULSE_SCREENSHOT_DIR="$PWD/screenshots" xcodebuild test-without-building \
            -project WatchPulse.xcodeproj \
            -scheme WatchPulse \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -only-testing:WatchPulseUITests/ScreenshotTests \
            CODE_SIGNING_ALLOWED=NO
          echo "::notice title=screenshots::$(ls screenshots | wc -l | tr -d ' ') screenshots"
          ls screenshots

      - name: Upload screenshots
        if: ${{ !cancelled() && env.SIM_UDID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: screenshots/*.png
          retention-days: 90
          if-no-files-found: warn
